[build]
  command = "node tools/build.cjs"
  publish = "dist"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
